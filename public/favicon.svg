<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="dinacityBrandGradientFavicon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0056D6" />
      <stop offset="40%" stop-color="#0072E5" />
      <stop offset="70%" stop-color="#1DB954" />
      <stop offset="100%" stop-color="#34C759" />
    </linearGradient>
  </defs>

  <!-- Modern dark squircle background for high contrast in light & dark browser tabs -->
  <rect width="64" height="64" rx="16" fill="#0c1527"/>
  <rect width="64" height="64" rx="16" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Logo emblem centered (scaled from 72x68) -->
  <g transform="translate(7, 6) scale(0.70)" fill="url(#dinacityBrandGradientFavicon)" stroke="url(#dinacityBrandGradientFavicon)">
    <!-- Outer 'D' Top Bar & Upper Outer Arc -->
    <path d="M 2 9 L 44 9 A 28 28 0 0 1 60 21 L 55 25 A 22 22 0 0 0 44 15 L 10 15 L 4 9 Z" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Outer 'D' Bottom Bar & Lower Outer Arc -->
    <path d="M 66 38 A 28 28 0 0 1 44 65 L 18 65 L 24 59 L 44 59 A 22 22 0 0 0 60 41 Z" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Left Vertical Spine of 'D' -->
    <path d="M 8 18 L 14 18 L 14 43 L 8 43 Z" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Inner Chevron -->
    <path d="M 14 18 L 37 35 L 33 39 L 14 24 Z" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Arrow Shaft: 45° continuous diagonal bar -->
    <path d="M 1 65 L 8 65 L 60 13 L 54 9 Z" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Arrowhead at Top-Right -->
    <path d="M 67 2 L 52 5 L 56 10 L 59 13 L 67 17 Z" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Mid Target Arc -->
    <path d="M 44 19 A 18 18 0 0 1 54 24 L 51 28 A 14 14 0 0 0 44 23 Z" stroke-width="0.5" stroke-linejoin="round" />
    <path d="M 58 40 A 18 18 0 0 1 44 55 L 44 50 A 13 13 0 0 0 53 39 Z" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Inner Target Arc -->
    <path d="M 44 27 A 10 10 0 0 1 49 30 L 47 33 A 7 7 0 0 0 44 30 Z" stroke-width="0.5" stroke-linejoin="round" />
    <path d="M 52 40 A 9 9 0 0 1 44 46 L 44 42 A 6 6 0 0 0 49 39 Z" stroke-width="0.5" stroke-linejoin="round" />

    <!-- Circuit Connection Node -->
    <circle cx="53" cy="44" r="2.5" />
  </g>
</svg>
